name: CI

# A change that's only docs can't break a test, so it skips both jobs (the macOS one bills at 10x
# rate). Anything else in the change, even one line, runs everything. No test reads these files,
# and none of them ship in the app. Secret scanning (gitleaks.yml) still runs on every change.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

# Cancel in-flight runs for the same ref when a new commit lands. Saves
# macOS minutes (which bill at 10x rate) when someone force-pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the Node that Electron 41 bundles, which is what the app
          # actually runs on. The agent stores are read through node:sqlite,
          # absent before 22 and behind a flag until 23.4.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # node-pty is a native module that needs to be rebuilt against the
      # Electron ABI before either the app or the e2e suite can spawn a pty.
      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Run unit tests
        run: npm test

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Unit tests only: they stub Electron, so no native rebuild or display is needed.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
