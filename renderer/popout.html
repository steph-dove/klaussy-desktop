<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none';">
  <title>Klaussy</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Pre-init defaults matching the Dark preset; theme.js overwrites them with the selected theme. */
    :root {
      --sidebar-bg: #16161d;
      --border: #272730;
      --text: #e8e8ee;
      --text-muted: #9a9aa6;
      --success: #46c463;
      --term-bg: #0d0d12;
    }
    body { background: var(--term-bg); height: 100vh; overflow: hidden; }
    #popout-header {
      height: 32px;
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      color: var(--text-muted);
      -webkit-app-region: drag;
      gap: 8px;
    }
    #popout-header .dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--success);
    }
    #popout-header .task-name {
      font-weight: 600; color: var(--text);
    }
    #popout-terminal {
      position: absolute;
      top: 32px; left: 0; right: 0; bottom: 0;
      padding: 4px;
    }
  </style>
</head>
<body>
  <div id="popout-header">
    <span class="dot"></span>
    <span class="task-name" id="popout-name">Task</span>
    <span id="popout-branch"></span>
  </div>
  <main id="popout-terminal" aria-labelledby="popout-name"></main>
  <script src="a11y.js"></script>
  <script src="utils.js"></script>
  <script src="theme.js"></script>
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="popout.js"></script>
</body>
</html>
